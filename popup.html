<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlight Saver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">

    <!-- AUTH SCREEN (shown when logged out) -->
    <div id="auth-screen" class="auth-screen hidden">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" width="32" height="32">
          <defs>
            <linearGradient id="authGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#6366f1"/>
              <stop offset="100%" style="stop-color:#8b5cf6"/>
            </linearGradient>
          </defs>
          <path fill="url(#authGrad)" d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z"/>
        </svg>
        <span class="auth-logo-text">Highlighter</span>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Sign In</button>
        <button id="tab-register" class="auth-tab">Sign Up</button>
      </div>

      <div id="auth-error" class="auth-error hidden"></div>

      <div class="auth-form">
        <div class="form-group">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button id="auth-submit-btn" class="btn btn-full btn-indigo">Sign In</button>
      </div>

      <p class="auth-footer-note">Your highlights are private and tied to your account.</p>
    </div>

    <!-- MAIN APP (shown when logged in) -->
    <div id="main-app" class="hidden">

      <!-- Header -->
      <header class="app-header">
        <div class="logo-area">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z"/>
            </svg>
          </div>
          <div class="logo-text">
            <h1>Highlighter</h1>
            <span id="highlight-count" class="badge">0 saved</span>
          </div>
        </div>
        <div class="header-actions">
          <span id="user-email-display" class="user-email"></span>
          <button id="summarize-page-btn" class="icon-btn" title="Summarize Current Webpage">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </button>
          <button id="summarize-all-btn" class="icon-btn btn-primary" title="Summarize all saved highlights">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1L14 13.76V16h-4v-2.24l-.85-.56A5.025 5.025 0 017 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.09-2.15 4.1z"/>
            </svg>
          </button>
          <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme">
            <svg class="icon theme-icon-sun hidden" viewBox="0 0 24 24">
              <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
            </svg>
            <svg class="icon theme-icon-moon" viewBox="0 0 24 24">
              <path d="M12 3c-4.97 0-9 4.03-9 9 0 4.97 4.03 9 9 9 3.69 0 6.87-2.22 8.28-5.39-.63.09-1.28.16-1.95.16-5.52 0-10-4.48-10-10 0-.67.07-1.32.16-1.95C14.22 5.13 12 3 12 3z"/>
            </svg>
          </button>
          <button id="settings-btn" class="icon-btn" title="Account Settings">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
          </button>
          <button id="signout-btn" class="icon-btn" title="Sign out">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Settings Panel Banner -->
      <div id="api-key-banner" class="api-key-banner hidden">
        <div class="settings-tabs">
          <span class="settings-title" style="font-size:12px;font-weight:600;color:var(--text-main);">Change Password</span>
          <!-- <button id="tab-settings-key" class="settings-tab">API Key</button> -->
          <!-- <button id="tab-settings-pwd" class="settings-tab active">Change Password</button> -->
          <button id="api-key-cancel-btn" class="close-text-btn">&times;</button>
        </div>

        <!-- API Key Tab (Hidden for end users)
        <div id="settings-key-section" class="settings-section hidden">
          <div class="api-key-banner-inner">
            <svg viewBox="0 0 24 24" class="api-key-icon"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
            <input type="password" id="api-key-input" placeholder="Enter Groq API key (gsk_...)" autocomplete="off"/>
            <button id="api-key-save-btn" class="btn btn-indigo btn-sm">Save</button>
          </div>
          <p class="api-key-hint">Get your free key at <a href="https://console.groq.com" target="_blank">console.groq.com</a></p>
        </div>
        -->

        <!-- Change Password Section -->
        <div id="settings-pwd-section" class="settings-section">

          <div id="pwd-change-error" class="auth-error hidden" style="margin-bottom:8px;"></div>
          <div class="form-group-sm">
            <input type="password" id="pwd-current" placeholder="Current Password" autocomplete="current-password"/>
          </div>
          <div class="form-group-sm">
            <input type="password" id="pwd-new" placeholder="New Password (min 6 chars)" autocomplete="new-password"/>
          </div>
          <button id="pwd-save-btn" class="btn btn-indigo btn-sm btn-full" style="margin-top:6px;">Update Password</button>
        </div>
      </div>

      <!-- Main View -->
      <main class="app-body">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search saved highlights...">
        </div>

        <div id="highlights-list" class="highlights-list scrollable"></div>

        <div id="pagination-controls" class="pagination-controls hidden">
          <button id="prev-page-btn" class="pagination-btn">&laquo; Prev</button>
          <span id="pagination-info" class="pagination-info">Page 1 of 1</span>
          <button id="next-page-btn" class="pagination-btn">Next &raquo;</button>
        </div>

        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm-4 8H7v-2h6v2z"/>
            </svg>
          </div>
          <p class="empty-title">No highlights saved yet</p>
          <p class="empty-text">Highlight text on any website and click "Save Highlight" to see them here.</p>
        </div>
      </main>


      <!-- AI Summary Overlay -->
      <section id="summary-overlay" class="summary-overlay hidden">
        <div class="overlay-card">
          <header class="overlay-header">
            <div class="overlay-title-group">
              <svg class="icon-sparkle" viewBox="0 0 24 24">
                <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
              </svg>
              <h2 id="summary-title">AI Summary</h2>
            </div>
            <button id="close-summary-btn" class="close-text-btn">&times;</button>
          </header>
          <div class="overlay-body">
            <div id="summary-loading" class="summary-loading hidden">
              <div class="skeleton-line header-skeleton"></div>
              <div class="skeleton-line body-skeleton-1"></div>
              <div class="skeleton-line body-skeleton-2"></div>
              <div class="skeleton-line body-skeleton-3"></div>
            </div>
            <div id="summary-text" class="summary-text scrollable"></div>
          </div>
          <footer class="overlay-footer">
            <button id="copy-summary-btn" class="btn btn-secondary">
              <svg class="icon-small" viewBox="0 0 24 24">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
              </svg>
              Copy to Clipboard
            </button>
          </footer>
        </div>
      </section>

    </div><!-- /#main-app -->
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
